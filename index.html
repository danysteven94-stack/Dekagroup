<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEKA LOG — Jesyon Kontenè</title>
<style>
:root{
  --navy:#0B2138; --navy-deep:#071626;
  --teal:#0E7C86; --teal-deep:#0A5F67;
  --steel:#3C5A73; --steel-light:#8CA0B3;
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#0F1B24;
  --rust:#D9531E; --rust-deep:#B4400F;
  --amber:#DA8F00; --amber-bg:#F2A900;
  --green:#1D7A5A; --green-deep:#155C43;
  --line:#E3E8EC; --line-soft:#EDF1F3;
  --muted:#5B6B76; --muted-light:#8A98A3;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-head: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font);color:var(--ink);}
#root{min-height:100vh;}
button,input,select{font-family:var(--font);}
.hidden{display:none !important;}

/* ---------- GATE ---------- */
.gate-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.gate-card{background:var(--panel);border-radius:12px;padding:36px 32px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center;}
.gate-logo{width:34px;height:34px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;overflow:hidden;}
.gate-logo img{width:100%;height:100%;object-fit:cover;}
.gate-title{font-weight:800;font-size:18px;color:var(--navy);letter-spacing:.03em;}
.field-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.input{font-size:14px;padding:9px 11px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;width:100%;}
.gate-input{text-align:center;font-size:18px;letter-spacing:.3em;}
.gate-err{color:var(--rust-deep);font-size:12.5px;margin-top:8px;text-align:center;}
.gate-btn{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:11px 0;font-weight:700;font-size:14px;cursor:pointer;}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:linear-gradient(185deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{width:32px;height:32px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 3px rgba(14,124,134,.18);color:#fff;font-weight:800;overflow:hidden;}
.sidebar-logo img{width:100%;height:100%;object-fit:cover;}
.sidebar-name{font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;line-height:1;}
.sidebar-sub{font-size:10.5px;color:var(--steel-light);margin-top:3px;letter-spacing:.03em;}
.sidebar-nav{display:flex;flex-direction:column;padding:14px 0;flex:1;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 18px;margin:2px 10px;border-radius:7px;cursor:pointer;border:none;background:transparent;width:calc(100% - 20px);text-align:left;font-weight:700;font-size:13.5px;color:var(--steel-light);transition:background .15s ease,color .15s ease;}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:var(--teal);color:#fff;}
.navitem .count{margin-left:auto;background:var(--rust);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;}
.navitem.active .count{background:rgba(255,255,255,.25);}
.sidebar-foot{padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--steel-light);display:flex;align-items:center;gap:7px;}
.dot{width:6px;height:6px;border-radius:999px;background:#3FBE7F;flex-shrink:0;}
.dot.err{background:var(--rust);}

.main{flex:1;min-width:0;}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;}
.topbar-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-light);}
.topbar-title{font-size:19px;font-weight:800;color:var(--navy);}
.topbar-stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.topbar-stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
.content{padding:24px 28px 60px;}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;}
.h2{font-size:22px;font-weight:800;color:var(--navy);margin:0;}
.h3{font-size:15px;font-weight:800;color:var(--navy);margin:0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 1px 2px rgba(15,27,36,.04);}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,27,36,.04);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.kpi-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.kpi-value{font-family:var(--font-mono);font-weight:800;font-size:30px;color:var(--ink);line-height:1;}
.kpi-sub{font-size:11.5px;color:var(--muted-light);}

.grid-dash{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.grid-dash{grid-template-columns:1fr;}}

.linklike{background:none;border:none;color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;padding:0;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;}
.empty.compact{padding:24px 10px;}

.plate{font-family:var(--font-mono);font-weight:800;letter-spacing:.03em;background:var(--ink);color:#fff;padding:3px 8px;border-radius:4px;font-size:12.5px;border:1px solid var(--steel);display:inline-block;}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#fff;padding:4px 10px;border-radius:4px;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.form-hint{font-size:11.5px;color:var(--muted-light);margin:8px 0 26px;}
.btn{font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;}
.btn.small{font-size:12px;padding:5px 10px;}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line);}
.btn.danger{background:transparent;color:var(--rust-deep);border-color:rgba(180,64,15,.3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;}
.search-wrap{position:relative;}
.search-wrap .input{width:230px;padding-left:30px;}
.search-icon{position:absolute;left:10px;top:10px;color:var(--muted);}
.filter-btn{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
.filter-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}

.row{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
.row-min{min-width:170px;}
.row-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.row-sub.light{color:var(--muted-light);}
.mini{font-size:12px;color:var(--muted);min-width:100px;}
.mini strong{display:block;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);margin-top:1px;}
.row-actions{display:flex;gap:6px;width:100%;justify-content:flex-end;margin-top:2px;}

.bill-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);margin-bottom:10px;}
.bill-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.product-tag{font-size:11.5px;font-weight:700;color:var(--teal-deep);background:rgba(14,124,134,.09);border:1px solid rgba(14,124,134,.25);padding:3px 9px;border-radius:999px;}
.progress{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden;margin-bottom:12px;}
.progress-fill{height:100%;border-radius:999px;transition:width .3s ease;}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;}
.mini-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-family:var(--font-mono);background:var(--bg);border-radius:5px;padding:3px 7px;color:var(--ink);}
.mini-dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;}

.notif-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid rgba(29,122,90,.19);background:#F2FBF7;border-radius:8px;margin-bottom:8px;}
.notif-ico{width:32px;height:32px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:800;}
.notif-msg{font-size:13.5px;color:var(--ink);font-weight:700;}
.notif-date{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);}

.alert{display:flex;align-items:center;gap:8px;background:#FFF3E8;border:1px solid rgba(217,83,30,.33);color:var(--rust-deep);font-size:12.5px;padding:8px 12px;border-radius:6px;margin-bottom:18px;}

.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:50;}
.toast{background:var(--green-deep);color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13.5px;max-width:320px;}
.modal-overlay{position:fixed;inset:0;background:rgba(11,33,56,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
.modal-card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3);}

@media (max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;}
  .sidebar-brand{padding:0 10px 0 4px;border-bottom:none;flex-shrink:0;}
  .sidebar-nav{flex-direction:row;flex:1;}
  .navitem{margin:0 3px;white-space:nowrap;}
  .sidebar-foot{display:none;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>

/* ============ ITIL ============ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function formatDate(iso){
  if(!iso) return "—";
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function daysBetween(startISO, endISO){
  if(!startISO) return 0;
  var start = new Date(startISO + "T00:00:00");
  var end = new Date((endISO || todayISO()) + "T00:00:00");
  var diff = Math.round((end - start) / 86400000);
  return Math.max(1, diff + 1);
}
function containerStatus(c){
  if(c.dateLeft) return "kite";
  if(c.dateEmpty) return "vid";
  if(c.dateEntered && c.dateVerified) return "full";
  if(c.dateEntered) return "pokoverifye";
  return "disponib";
}
function billStatus(bill, containers){
  var list = containers.filter(function(c){ return c.billId === bill.id; });
  if(list.length === 0) return "vid";
  if(list.every(function(c){ return !c.dateEntered; })) return "planifye";
  if(list.every(function(c){ return c.dateLeft; })) return "fini";
  return "aktif";
}
function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }

  filterStatus: "tout",

  entryMode: "antre",

function loadData(){
  state.loadingData = true;
  state.loadError = false;
  state.loadErrorDetail = "";
  fetch("/api/data")
    .then(function(r){
      if(!r.ok){
        return r.text().then(function(t){ throw new Error("HTTP " + r.status + ": " + (t || r.statusText)); });
      }
      return r.json();
    })
    .then(function(parsed){
      state.containers = parsed.containers || [];
      state.bills = parsed.bills || [];
      state.notifications = parsed.notifications || [];
      state.loadingData = false;
      render();
    })
    .catch(function(err){
      state.loadingData = false;
      state.loadError = true;
      state.loadErrorDetail = err && err.message ? err.message : String(err);
      render();
    });
}

function updateSaveIndicator(){
  var foot = document.querySelector(".sidebar-foot");
  if(!foot) return;
  foot.innerHTML = '<span class="dot' + (state.saveErr ? ' err' : '') + '"></span>' +
    (state.saveErr ? "Erè pandan sovgad — chanjman an lokal sèlman" : "Done yo sove nan baz done pataje a");
  if(state.saveErr && state.saveErrorDetail) foot.title = state.saveErrorDetail;
}

function persist(){
  var payload = JSON.stringify({ containers: state.containers, bills: state.bills, notifications: state.notifications });
  fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload })
    .then(function(r){
      if(!r.ok){
        return r.text().then(function(t){
          state.saveErr = true;
          state.saveErrorDetail = "HTTP " + r.status + ": " + (t || r.statusText);
          updateSaveIndicator();
        });
      }
      state.saveErr = false;
      state.saveErrorDetail = "";
      updateSaveIndicator();
    })
    .catch(function(err){
      state.saveErr = true;
      state.saveErrorDetail = err && err.message ? err.message : String(err);
      updateSaveIndicator();
    });
}

function pushToast(msg){
  var id = uid();
  state.toasts.push({ id: id, message: msg });
  render();
  setTimeout(function(){
    state.toasts = state.toasts.filter(function(t){ return t.id !== id; });
    render();
  }, 5000);
}

function recomputeBills(){
  state.bills = state.bills.map(function(b){
    var status = billStatus(b, state.containers);
    if(status === "fini" && !b.completedAt){
      var note = { id: uid(), billNumewo: b.numewo, date: todayISO(), message: "Bill " + b.numewo + " fini — tout kontenè li yo kite." };
      state.notifications = [note].concat(state.notifications).slice(0, 200);
      pushToast(note.message);
      return Object.assign({}, b, { completedAt: todayISO() });
    }
    if(status !== "fini" && b.completedAt){
      return Object.assign({}, b, { completedAt: null });
    }
    return b;
  });
}

/* ============ AKSYON ============ */
function addContainer(vals){
  var numewo = (vals.numewo || "").trim().toUpperCase();
  if(!numewo) return;
  var billId = "";

  if(vals.billMode === "nouvo"){
    var numewoBill = (vals.billNumewo || "").trim().toUpperCase();
    if(!numewoBill) return;
    var existing = state.bills.find(function(b){ return b.numewo === numewoBill; });
    if(existing){
      billId = existing.id;
    }else{
      var product = (vals.product || "").trim();
      if(!product) return;
      var nb = { id: uid(), numewo: numewoBill, product: product, completedAt: null };
      state.bills.push(nb);
      billId = nb.id;
    }
  }else{
    if(!vals.billId) return;
    billId = vals.billId;
  }

  var dateEntered = null, dateExpected = null;
  if(vals.entryMode === "planifye"){
    dateEntered = null;
    dateExpected = vals.dateExpected || null;
  }else{
    dateEntered = vals.dateEntered || todayISO();
    dateExpected = null;
  }

  state.containers.unshift({
    id: uid(), numewo: numewo, billId: billId,
    dateEntered: dateEntered, dateExpected: dateExpected,
    dateVerified: null, depo: null, trucking: null,
    dateEmpty: null, dateLeft: null
  });

  recomputeBills();
  persist();
  state.billMode = "nouvo";
  state.entryMode = "antre";
  render();
}

function confirmEnter(id){
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateEntered: todayISO() }) : c; });
  recomputeBills(); persist(); render();
}
function unconfirmEnter(id){
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateEntered: null, dateVerified: null }) : c; });
  recomputeBills(); persist(); render();
}
function openVerifyModal(id){
  var c = state.containers.find(function(x){ return x.id === id; });
  if(!c) return;
  state.modal = { mode: "verify", id: id, depo: c.depo || "", trucking: c.trucking || "" };
  render();
}
function openTransferModal(id){
  var c = state.containers.find(function(x){ return x.id === id; });
  if(!c) return;
  state.modal = { mode: "transfer", id: id, depo: c.depo || "", trucking: c.trucking || "" };
  render();
}
function closeModal(){
  state.modal = null;
  render();
}
function submitModal(){
  if(!state.modal) return;
  var depoEl = document.getElementById("modal-depo");
  var truckingEl = document.getElementById("modal-trucking");
  var depo = depoEl ? depoEl.value.trim() : "";
  var trucking = truckingEl ? truckingEl.value : "";
  if(!depo) return;

  var id = state.modal.id, mode = state.modal.mode;
  var container = state.containers.find(function(c){ return c.id === id; });
  if(!container){ state.modal = null; render(); return; }

  if(mode === "verify"){
    state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateVerified: todayISO(), depo: depo, trucking: trucking || null }) : c; });
    state.modal = null;
    recomputeBills(); persist(); render();
  }else{
    var oldDepo = container.depo || "—";
    var changedDepo = depo !== (container.depo || "");
    var changedTrucking = trucking !== (container.trucking || "");
    state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { depo: depo, trucking: trucking || null }) : c; });
    state.modal = null;
    if(changedDepo || changedTrucking){
      var msg = "Kontenè " + container.numewo + " transfere nan depo " + depo + " (te nan " + oldDepo + ")" + (trucking ? " — trucking: " + trucking : "") + ".";
      var note = { id: uid(), billNumewo: "", date: todayISO(), message: msg };
      state.notifications = [note].concat(state.notifications).slice(0, 200);
      pushToast(note.message);
    }
    persist(); render();
  }
}
function markEmpty(id){
  var container = state.containers.find(function(c){ return c.id === id; });
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateEmpty: todayISO() }) : c; });
  if(container){
    var bill = state.bills.find(function(b){ return b.id === container.billId; });
    var note = {
      id: uid(),
      billNumewo: bill ? bill.numewo : "",
      date: todayISO(),
      message: "Kontenè " + container.numewo + " vid kounye a" + (bill ? " (Bill " + bill.numewo + ")" : "") + "."
    };
    state.notifications = [note].concat(state.notifications).slice(0, 200);
    pushToast(note.message);
  }
  recomputeBills(); persist(); render();
}
function undoEmpty(id){
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateEmpty: null, dateLeft: null }) : c; });
  recomputeBills(); persist(); render();
}
function markLeft(id){
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateLeft: todayISO() }) : c; });
  recomputeBills(); persist(); render();
}
function undoLeft(id){
  state.containers = state.containers.map(function(c){ return c.id === id ? Object.assign({}, c, { dateLeft: null }) : c; });
  recomputeBills(); persist(); render();
}
function deleteContainer(id){
  state.containers = state.containers.filter(function(c){ return c.id !== id; });
  recomputeBills(); persist(); render();
}
function deleteBill(id){
  var hasContainers = state.containers.some(function(c){ return c.billId === id; });
  if(hasContainers) return;
  state.bills = state.bills.filter(function(b){ return b.id !== id; });
  persist(); render();
}

function computeStats(){
  var total = state.containers.length;
  var disponib = state.containers.filter(function(c){ return containerStatus(c) === "disponib"; }).length;
  var pokoverifye = state.containers.filter(function(c){ return containerStatus(c) === "pokoverifye"; }).length;
  var full = state.containers.filter(function(c){ return containerStatus(c) === "full"; }).length;
  var vid = state.containers.filter(function(c){ return containerStatus(c) === "vid"; }).length;
  var kite = state.containers.filter(function(c){ return containerStatus(c) === "kite"; }).length;
  var billsAktif = state.bills.filter(function(b){ return billStatus(b, state.containers) === "aktif"; }).length;
  var billsFini = state.bills.filter(function(b){ return billStatus(b, state.containers) === "fini"; }).length;
  return { total: total, disponib: disponib, pokoverifye: pokoverifye, full: full, vid: vid, kite: kite, billsAktif: billsAktif, billsFini: billsFini };
}

function renderContainersList(){
  var list = state.containers.filter(function(c){
    if(state.filterStatus !== "tout" && containerStatus(c) !== state.filterStatus) return false;
    if(!state.search.trim()) return true;
    var bill = state.bills.find(function(b){ return b.id === c.billId; });
    var q = state.search.trim().toLowerCase();
    return c.numewo.toLowerCase().indexOf(q) !== -1 ||
      (bill && bill.numewo.toLowerCase().indexOf(q) !== -1) ||
      (bill && bill.product && bill.product.toLowerCase().indexOf(q) !== -1);
  }).sort(function(a,b){ return a.dateEntered < b.dateEntered ? 1 : -1; });

  var filters = ["tout","disponib","pokoverifye","full","vid","kite"].map(function(s){
    var active = state.filterStatus === s;
    return '<button class="filter-btn' + (active ? " active" : "") + '" data-action="set-filter" data-filter="' + s + '">' + (s === "tout" ? "Tout" : STATUS_LABEL[s]) + '</button>';
  }).join("");

  var head = '' +
  '<div class="section-head"><div><div class="eyebrow">' + list.length + ' rezilta</div><h2 class="h2">Rejis Kontenè</h2></div>' +
    '<div class="toolbar">' +
      '<div class="search-wrap"><span class="search-icon">' + icon("search", 14) + '</span>' +
      '<input class="input" id="f-search" placeholder="Chèche kontenè, bill oswa pwodwi..." value="' + esc(state.search) + '" /></div>' +

    '</div>' +
  '</div>';

  if(list.length === 0){
    return head + '<div class="empty">' + icon("circle", 22) + '<div>Pa gen kontenè ki koresponn. Ajoute yon kontenè pou kòmanse.</div></div>';
  }

  var rows = list.map(function(c){
    var bill = state.bills.find(function(b){ return b.id === c.billId; });
    var status = containerStatus(c);
    var jouFull = daysBetween(c.dateEntered, c.dateEmpty);
    var jouFullDisplay = (status === "disponib" || status === "pokoverifye") ? "—" : (jouFull + " jou");
    var color = COLOR[status];

    var actions = "";
    if(status === "disponib"){
      actions += '<button class="btn small teal" data-action="confirm-enter" data-id="' + c.id + '">Konfime Antre Jodi a</button>';
    }else if(status === "pokoverifye"){
      actions += '<button class="btn small teal" data-action="verify-container" data-id="' + c.id + '">Verifye &amp; Mete nan Depo</button>';
      actions += '<button class="btn small ghost" data-action="unconfirm-enter" data-id="' + c.id + '">' + icon("undo", 12) + ' Anile Antre</button>';
    }else if(status === "full"){
      actions += '<button class="btn small ghost" data-action="transfer-depo" data-id="' + c.id + '">Transfere Depo</button>';
      actions += '<button class="btn small ghost" data-action="mark-empty" data-id="' + c.id + '">Mete Vid Jodi a</button>';
    }else if(status === "vid"){
      actions += '<button class="btn small ghost" data-action="undo-empty" data-id="' + c.id + '">' + icon("undo", 12) + ' Anile Vid</button>';
      actions += '<button class="btn small green" data-action="mark-left" data-id="' + c.id + '">Kontenè Kite Jodi a</button>';
    }else{
      actions += '<button class="btn small ghost" data-action="undo-left" data-id="' + c.id + '">' + icon("undo", 12) + ' Anile Kite</button>';
    }
    actions += '<button class="btn small danger" data-action="delete-container" data-id="' + c.id + '">' + icon("trash", 12) + '</button>';

    var expectedMini = c.dateExpected ? '<div class="mini">Dat Prevwa<strong style="color:' + COLOR.disponib + '">' + formatDate(c.dateExpected) + '</strong></div>' : '';
    var depoLine = c.depo ? '<div class="row-sub light">Depo: <strong style="color:' + COLOR.full + '">' + esc(c.depo) + '</strong></div>' : '';
    var truckingLine = c.trucking ? '<div class="row-sub light">Trucking: <strong style="color:var(--muted)">' + esc(c.trucking) + '</strong></div>' : '';

    return '' +
    '<div class="row" style="border-left:4px solid ' + color + '">' +
      '<div class="row-min">' +
        '<span class="plate" style="border-color:' + color + '">' + esc(c.numewo) + '</span>' +
        '<div class="row-sub">Bill: <strong style="color:var(--navy)">' + (bill ? esc(bill.numewo) : "—") + '</strong></div>' +
        '<div class="row-sub light">Pwodwi: <strong style="color:var(--muted)">' + (bill && bill.product ? esc(bill.product) : "—") + '</strong></div>' +
        depoLine +
        truckingLine +
      '</div>' +
      expectedMini +
      '<div class="mini">Antre<strong>' + formatDate(c.dateEntered) + '</strong></div>' +
      '<div class="mini">Jou Full<strong style="color:' + COLOR.rust + '">' + jouFullDisplay + '</strong></div>' +
      '<div class="mini">Vid Depi<strong>' + formatDate(c.dateEmpty) + '</strong></div>' +
      '<div class="mini">Kite Depi<strong>' + formatDate(c.dateLeft) + '</strong></div>' +
      '<div style="margin-left:auto"><span class="chip" style="color:' + color + ';background:' + color + '1A;border:1px solid ' + color + '55"><span class="mini-dot" style="background:' + color + '"></span>' + STATUS_LABEL[status] + '</span></div>' +

  return head + rows;

/* ============ JENERATÈ PDF (san depandans ekstèn) ============ */
function winAnsiByte(ch){
  var code = ch.charCodeAt(0);
  if(code === 0x2014) return 0x97;
  if(code === 0x2013) return 0x96;
  if(code === 0x2018) return 0x91;
  if(code === 0x2019) return 0x92;
  if(code === 0x201C) return 0x93;
  if(code === 0x201D) return 0x94;
  if(code <= 0xFF) return code;
  return 0x3F;
}
function pdfEscapeText(str){
  var out = "";
  for(var i=0;i<str.length;i++){
    var b = winAnsiByte(str[i]);
    if(b===0x28||b===0x29||b===0x5C) out += String.fromCharCode(0x5C);
    out += String.fromCharCode(b);
  }
  return out;
}
function buildPdfBytes(title, subtitle, headers, colX, colChars, rows){
  var PAGE_W=595, PAGE_H=842, MARGIN_L=40, MARGIN_BOTTOM=50, ROW_H=16;

  function textOp(font,size,x,y,text){
    return "BT /"+font+" "+size+" Tf 1 0 0 1 "+x+" "+y+" Tm ("+pdfEscapeText(text)+") Tj ET\n";
  }

  var firstPageStartY = 792-70, nextPageStartY = 792-40;
  var rowsFirstPage = Math.max(1, Math.floor((firstPageStartY-MARGIN_BOTTOM)/ROW_H));
  var rowsPerNextPage = Math.max(1, Math.floor((nextPageStartY-MARGIN_BOTTOM)/ROW_H));

  var pages = [];
  var idx = 0, first = true;
  if(rows.length === 0){ pages.push([]); }
  while(idx < rows.length){
    var capacity = first ? rowsFirstPage : rowsPerNextPage;
    pages.push(rows.slice(idx, idx+capacity));
    idx += capacity;
    first = false;
  }

  function buildPageContent(pageRows, isFirst){
    var content = "", y;
    if(isFirst){
      content += textOp("F2",16,MARGIN_L,800,title);
      content += textOp("F1",10,MARGIN_L,782,subtitle);
      y = 792-70;
    }else{
      y = 792-40;
    }
    for(var h=0; h<headers.length; h++){ content += textOp("F2",9,colX[h],y,headers[h]); }
    y -= ROW_H;
    content += "0.6 w 0.6 0.6 0.6 RG "+MARGIN_L+" "+(y+6)+" m "+(PAGE_W-MARGIN_L)+" "+(y+6)+" l S\n";
    for(var r=0; r<pageRows.length; r++){
      var row = pageRows[r];
      for(var c=0; c<row.length; c++){
        var cellText = row[c] || "";
        if(colChars[c] && cellText.length > colChars[c]) cellText = cellText.slice(0, colChars[c]-1) + ".";
        content += textOp("F1",9,colX[c],y,cellText);
      }
      y -= ROW_H;
    }
    if(pageRows.length === 0){ content += textOp("F1",10,MARGIN_L,y,"Pa gen kontenè."); }
    return content;
  }

  var numPages = pages.length;
  var kids = [];
  for(var p=0; p<numPages; p++){ kids.push((5+p*2)+" 0 R"); }

  var objs = [];
  objs.push({dict:true, body:"<< /Type /Catalog /Pages 2 0 R >>"});
  objs.push({dict:true, body:"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+numPages+" >>"});
  objs.push({dict:true, body:"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"});
  objs.push({dict:true, body:"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"});
  for(var pi=0; pi<numPages; pi++){
    var pageContent = buildPageContent(pages[pi], pi===0);
    var pageObjBody = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PAGE_W+" "+PAGE_H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+pi*2)+" 0 R >>";
    objs.push({dict:true, body:pageObjBody});
    objs.push({stream:true, body:pageContent});
  }

  var out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
  var offsets = [];
  for(var oi=0; oi<objs.length; oi++){
    offsets.push(out.length);
    var objNum = oi+1, o = objs[oi];
    if(o.dict){
      out += objNum+" 0 obj\n"+o.body+"\nendobj\n";
    }else{
      out += objNum+" 0 obj\n<< /Length "+o.body.length+" >>\nstream\n"+o.body+"\nendstream\nendobj\n";
    }
  }
  var xrefStart = out.length, total = objs.length+1;
  out += "xref\n0 "+total+"\n0000000000 65535 f \n";
  for(var xi=0; xi<offsets.length; xi++){
    var off = String(offsets[xi]);
    while(off.length < 10) off = "0"+off;
    out += off+" 00000 n \n";
  }
  out += "trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF";

  var bytes = new Uint8Array(out.length);
  for(var bi=0; bi<out.length; bi++){ bytes[bi] = out.charCodeAt(bi) & 0xFF; }
  return bytes;
}

function downloadReportPDF(status){
  var list = state.containers.filter(function(c){ return containerStatus(c) === status; });
  var title = "DEKA LOG " + String.fromCharCode(0x2014) + " " + (status === "full" ? "Rapò Kontenè Full" : "Rapò Kontenè Vid");
  var subtitle = "Jenere " + formatDate(todayISO()) + " " + String.fromCharCode(0x2014) + " Total: " + list.length + " kontenè";
  var headers = ["Nimewo","Bill","Pwodwi","Depo","Trucking","Dat Antre", status === "full" ? "Jou Full" : "Dat Vid"];
  var colX = [40,120,190,255,320,375,440];
  var colChars = [14,12,10,10,8,10,10];

  var rows = list.map(function(c){
    var bill = state.bills.find(function(b){ return b.id === c.billId; });
    var lastCol = status === "full" ? (daysBetween(c.dateEntered) + " jou") : formatDate(c.dateEmpty);
    return [
      c.numewo,
      bill ? bill.numewo : "—",
      bill && bill.product ? bill.product : "—",
      c.depo ? c.depo : "—",
      c.trucking ? c.trucking : "—",
      formatDate(c.dateEntered),
      lastCol
    ];
  });

  var bytes = buildPdfBytes(title, subtitle, headers, colX, colChars, rows);
  var blob = new Blob([bytes], { type: "application/pdf" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "deka-log-rapo-" + status + "-" + todayISO() + ".pdf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function renderLoadError(){

    ? '<div style="font-family:var(--font-mono);font-size:11px;color:var(--rust-deep);background:#FFF3E8;border:1px solid rgba(217,83,30,.3);border-radius:6px;padding:8px 10px;margin-bottom:16px;text-align:left;word-break:break-word">' + esc(state.loadErrorDetail) + '</div>'
    : '';
  return '<div class="gate-wrap"><div class="gate-card" style="text-align:center">' +
    '<div class="gate-brand" style="justify-content:center">' + icon("alert", 22, "#D9531E") + '</div>' +
    '<div style="font-weight:700;color:var(--rust-deep);margin-bottom:10px">Pa ka konekte ak baz done a</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Verifye koneksyon entènèt ou, epi eseye ankò. Si sa kontinye, kopye mesaj teknik anba a voye bay sipò a.</div>' +
    detail +
    '<button class="gate-btn" data-action="retry-load">Eseye Ankò</button>' +
  '</div></div>';
}

/* ============ EVENMAN (delegasyon, atache 1 sèl fwa) ============ */
document.addEventListener("submit", function(e){
  if(e.target && e.target.id === "gate-form"){
    e.preventDefault();
    var pw = document.getElementById("gate-pw").value;
    if(pw === APP_PASSWORD){
      safeSet(UNLOCK_KEY, "yes");
      state.unlocked = true;
      state.gateError = false;
    }else{
      state.gateError = true;
    }
    render();
  }
  if(e.target && e.target.id === "add-form"){
    e.preventDefault();
    var vals = {
      numewo: document.getElementById("f-numewo").value,
      billMode: state.billMode,
      entryMode: state.entryMode
    };
    if(state.entryMode === "planifye"){
      var deEl = document.getElementById("f-date-expected");
      vals.dateExpected = deEl ? deEl.value : "";
    }else{
      var dEl = document.getElementById("f-date");
      vals.dateEntered = dEl ? dEl.value : "";
    }
    if(state.billMode === "nouvo"){
      vals.billNumewo = document.getElementById("f-billnumewo").value;
      var pEl = document.getElementById("f-product");
      vals.product = pEl ? pEl.value : "";
    }else{
      var billSel = document.getElementById("f-billid");
      vals.billId = billSel ? billSel.value : "";
    }
    addContainer(vals);
  }
});

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  if(action === "set-tab"){
    state.tab = el.getAttribute("data-tab");
    state.search=""; state.filterStatus="tout";
    if(state.tab === "notifs" && state.lastSeenNotifCount < state.notifications.length){
      state.lastSeenNotifCount = state.notifications.length;
      safeSet(LAST_SEEN_NOTIF_KEY, String(state.lastSeenNotifCount));
    }
    render();
  }
  else if(action === "set-filter"){ state.filterStatus = el.getAttribute("data-filter"); render(); }
  else if(action === "confirm-enter"){ confirmEnter(id); }
  else if(action === "unconfirm-enter"){ unconfirmEnter(id); }
  else if(action === "verify-container"){ openVerifyModal(id); }
  else if(action === "transfer-depo"){ openTransferModal(id); }
  else if(action === "close-modal"){ closeModal(); }
  else if(action === "submit-modal"){ submitModal(); }
  else if(action === "print-report"){ downloadReportPDF(el.getAttribute("data-status")); }
  else if(action === "retry-load"){ loadData(); }
  else if(action === "mark-empty"){ markEmpty(id); }
  else if(action === "undo-empty"){ undoEmpty(id); }
  else if(action === "mark-left"){ markLeft(id); }
  else if(action === "undo-left"){ undoLeft(id); }
  else if(action === "delete-container"){ if(confirm("Efase kontenè sa a?")) deleteContainer(id); }
  else if(action === "delete-bill"){ if(confirm("Efase bill sa a?")) deleteBill(id); }
});

document.addEventListener("change", function(e){
  if(e.target && e.target.id === "f-billmode"){
    var savedNumewo = document.getElementById("f-numewo") ? document.getElementById("f-numewo").value : "";
    var savedDate = document.getElementById("f-date") ? document.getElementById("f-date").value : "";
    var savedDateExp = document.getElementById("f-date-expected") ? document.getElementById("f-date-expected").value : "";
    state.billMode = e.target.value;
    render();
    var n1 = document.getElementById("f-numewo"); if(n1) n1.value = savedNumewo;
    var d1 = document.getElementById("f-date"); if(d1 && savedDate) d1.value = savedDate;
    var de1 = document.getElementById("f-date-expected"); if(de1 && savedDateExp) de1.value = savedDateExp;
    var focusEl = document.getElementById("f-billnumewo") || document.getElementById("f-billid");
    if(focusEl) focusEl.focus();
  }
  if(e.target && e.target.id === "f-entrymode"){
    var savedNumewo2 = document.getElementById("f-numewo") ? document.getElementById("f-numewo").value : "";
    var savedBillNumewo = document.getElementById("f-billnumewo") ? document.getElementById("f-billnumewo").value : "";
    var savedProduct = document.getElementById("f-product") ? document.getElementById("f-product").value : "";
    var savedBillId = document.getElementById("f-billid") ? document.getElementById("f-billid").value : "";
    state.entryMode = e.target.value;
    render();
    var n2 = document.getElementById("f-numewo"); if(n2) n2.value = savedNumewo2;
    var bn2 = document.getElementById("f-billnumewo"); if(bn2) bn2.value = savedBillNumewo;
    var p2 = document.getElementById("f-product"); if(p2) p2.value = savedProduct;
    var bid2 = document.getElementById("f-billid"); if(bid2) bid2.value = savedBillId;
  }
});

document.addEventListener("input", function(e){
  if(e.target && e.target.id === "f-search"){
    state.search = e.target.value;
    render();
    var s = document.getElementById("f-search");
    if(s){ s.focus(); var v = s.value; s.value=""; s.value=v; }
  }
});

/* ============ DEMARE ============ */
render();
loadData();

})();
</script>
