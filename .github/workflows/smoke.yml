name: Smoke test after deploy

# Vercel reports each finished deployment to GitHub. For PRODUCTION deployments this checks that the live site
# answers, still sends its security headers, still hides its source code and still refuses anonymous visitors.
on:
  deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the live site
        run: node tools/smoke.js "${{ github.event.deployment_status.environment_url }}"
