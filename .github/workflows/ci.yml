name: CI

# Runs on every pull request and on every push to main.
# Vercel builds a preview for each pull request; this workflow decides whether the change is safe to merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check of every JavaScript file
        run: git ls-files '*.js' | xargs -n1 node --check

      - name: All test suites (Redis storage and PostgreSQL layer)
        run: npm test

      - name: No known high-severity vulnerabilities in the dependencies
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Real browser test (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund puppeteer-core

      - name: Login, every interface, CSP violations, injected-script blocking
        run: node --no-warnings tests/browser.smoke.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
