<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEKA LOG — Jesyon Kontenè</title>
<style>
:root{
  --navy:#0B2138; --navy-deep:#071626;
  --teal:#0E7C86; --teal-deep:#0A5F67;
  --steel:#3C5A73; --steel-light:#8CA0B3;
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#0F1B24;
  --rust:#D9531E; --rust-deep:#B4400F;
  --amber:#DA8F00; --amber-bg:#F2A900;
  --green:#1D7A5A; --green-deep:#155C43;
  --line:#E3E8EC; --line-soft:#EDF1F3;
  --muted:#5B6B76; --muted-light:#8A98A3;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-head: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font);color:var(--ink);}
#root{min-height:100vh;}
button,input,select{font-family:var(--font);}
.hidden{display:none !important;}

/* ---------- GATE ---------- */
.gate-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.gate-card{background:var(--panel);border-radius:12px;padding:36px 32px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center;}
.gate-logo{width:34px;height:34px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;overflow:hidden;}
.gate-logo img{width:100%;height:100%;object-fit:cover;}
.gate-title{font-weight:800;font-size:18px;color:var(--navy);letter-spacing:.03em;}
.field-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.input{font-size:14px;padding:9px 11px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;width:100%;}
.gate-input{text-align:center;font-size:18px;letter-spacing:.3em;}
.gate-err{color:var(--rust-deep);font-size:12.5px;margin-top:8px;text-align:center;}
.gate-btn{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:11px 0;font-weight:700;font-size:14px;cursor:pointer;}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:linear-gradient(185deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{width:32px;height:32px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 3px rgba(14,124,134,.18);color:#fff;font-weight:800;overflow:hidden;}
.sidebar-logo img{width:100%;height:100%;object-fit:cover;}
.sidebar-name{font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;line-height:1;}
.sidebar-sub{font-size:10.5px;color:var(--steel-light);margin-top:3px;letter-spacing:.03em;}
.sidebar-nav{display:flex;flex-direction:column;padding:14px 0;flex:1;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 18px;margin:2px 10px;border-radius:7px;cursor:pointer;border:none;background:transparent;width:calc(100% - 20px);text-align:left;font-weight:700;font-size:13.5px;color:var(--steel-light);transition:background .15s ease,color .15s ease;}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:var(--teal);color:#fff;}
.navitem .count{margin-left:auto;background:var(--rust);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;}
.navitem.active .count{background:rgba(255,255,255,.25);}
.sidebar-foot{padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--steel-light);display:flex;align-items:center;gap:7px;}
.dot{width:6px;height:6px;border-radius:999px;background:#3FBE7F;flex-shrink:0;}
.dot.err{background:var(--rust);}

.main{flex:1;min-width:0;}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;}
.topbar-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-light);}
.topbar-title{font-size:19px;font-weight:800;color:var(--navy);}
.topbar-stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.topbar-stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
.content{padding:24px 28px 60px;}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;}
.h2{font-size:22px;font-weight:800;color:var(--navy);margin:0;}
.h3{font-size:15px;font-weight:800;color:var(--navy);margin:0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 1px 2px rgba(15,27,36,.04);}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,27,36,.04);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.kpi-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.kpi-value{font-family:var(--font-mono);font-weight:800;font-size:30px;color:var(--ink);line-height:1;}
.kpi-sub{font-size:11.5px;color:var(--muted-light);}

.grid-dash{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.grid-dash{grid-template-columns:1fr;}}

.linklike{background:none;border:none;color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;padding:0;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;}
.empty.compact{padding:24px 10px;}

.plate{font-family:var(--font-mono);font-weight:800;letter-spacing:.03em;background:var(--ink);color:#fff;padding:3px 8px;border-radius:4px;font-size:12.5px;border:1px solid var(--steel);display:inline-block;}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#fff;padding:4px 10px;border-radius:4px;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.form-hint{font-size:11.5px;color:var(--muted-light);margin:8px 0 26px;}
.btn{font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;}
.btn.small{font-size:12px;padding:5px 10px;}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line);}
.btn.danger{background:transparent;color:var(--rust-deep);border-color:rgba(180,64,15,.3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;}
.search-wrap{position:relative;}
.search-wrap .input{width:230px;padding-left:30px;}
.search-icon{position:absolute;left:10px;top:10px;color:var(--muted);}
.filter-btn{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
.filter-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}

.row{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
.row-min{min-width:170px;}
.row-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.row-sub.light{color:var(--muted-light);}
.mini{font-size:12px;color:var(--muted);min-width:100px;}
.mini strong{display:block;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);margin-top:1px;}
.row-actions{display:flex;gap:6px;width:100%;justify-content:flex-end;margin-top:2px;}

.bill-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);margin-bottom:10px;}
.bill-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.product-tag{font-size:11.5px;font-weight:700;color:var(--teal-deep);background:rgba(14,124,134,.09);border:1px solid rgba(14,124,134,.25);padding:3px 9px;border-radius:999px;}
.progress{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden;margin-bottom:12px;}
.progress-fill{height:100%;border-radius:999px;transition:width .3s ease;}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;}
.mini-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-family:var(--font-mono);background:var(--bg);border-radius:5px;padding:3px 7px;color:var(--ink);}
.mini-dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;}

.notif-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid rgba(29,122,90,.19);background:#F2FBF7;border-radius:8px;margin-bottom:8px;}
.notif-ico{width:32px;height:32px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:800;}
.notif-msg{font-size:13.5px;color:var(--ink);font-weight:700;}
.notif-date{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);}

.alert{display:flex;align-items:center;gap:8px;background:#FFF3E8;border:1px solid rgba(217,83,30,.33);color:var(--rust-deep);font-size:12.5px;padding:8px 12px;border-radius:6px;margin-bottom:18px;}

.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:50;}
.toast{background:var(--green-deep);color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13.5px;max-width:320px;}
.modal-overlay{position:fixed;inset:0;background:rgba(11,33,56,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
.modal-card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3);}

@media (max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;}
  .sidebar-brand{padding:0 10px 0 4px;border-bottom:none;flex-shrink:0;}
  .sidebar-nav{flex-direction:row;flex:1;}
  .navitem{margin:0 3px;white-space:nowrap;}
  .sidebar-foot{display:none;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
